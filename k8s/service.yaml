# One fixed address in front of the pods; requests are spread over every ready pod.
#
#   inside the cluster:  http://product-similarity        (port 80)
#   from this laptop:    http://localhost:30080/docs      (Docker Desktop maps NodePorts to localhost)
apiVersion: v1
kind: Service
metadata:
  name: product-similarity
  labels:
    app: product-similarity
spec:
  type: NodePort
  selector:
    app: product-similarity            # send traffic to the pods with this label
  ports:
    - name: http
      port: 80                         # the Service's own port inside the cluster
      targetPort: http                 # the container's port 8000
      nodePort: 30080                  # the port opened on the node (30000 to 32767 allowed)
