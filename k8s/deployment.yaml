# Keeps 2 copies (pods) of the API running and replaces any that fail.
#
#   docker tag product-similarity product-similarity:1.0
#   kubectl apply -f k8s/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-similarity
  labels:
    app: product-similarity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-similarity          # the pods this Deployment looks after
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                      # on an update, start one new pod first,
      maxUnavailable: 0                # and remove an old one only once the new one is ready
  template:                            # the pod to make copies of
    metadata:
      labels:
        app: product-similarity
    spec:
      securityContext:
        runAsNonRoot: true             # refuse to start if the image would run as root
        runAsUser: 10001               # the user created in the Dockerfile
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: product-similarity:1.0
          imagePullPolicy: IfNotPresent    # use the locally built image; never download it
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:                  # reserved on the node for this pod (measured: about 280 MiB)
              cpu: 250m                # a quarter of one CPU
              memory: 320Mi
            limits:                    # the most it may use; above the memory limit it is restarted
              cpu: "1"
              memory: 512Mi
          readinessProbe:              # send it traffic only while /health answers
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:               # restart it if /health stops answering 3 times in a row
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:                   # when stopping, wait 5 s first, so the Service has
              sleep:                   # stopped sending it requests before uvicorn shuts down
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # the app never writes to disk
            capabilities:
              drop: ["ALL"]
